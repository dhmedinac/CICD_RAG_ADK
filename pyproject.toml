[project]
name = "rag-agent"
version = "0.1.0"
description = "RAG Agent built with Google ADK + Vertex AI RAG Engine, served on Cloud Run"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "google-adk>=1.2.0",
    "google-cloud-aiplatform>=1.71.0",
    "google-cloud-storage>=2.16.0",
    "google-cloud-secret-manager>=2.16.0",
    "cloud-sql-python-connector>=1.10.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "httpx>=0.27.0",
]

# Treat this repo as a deployable application, not a distributable library:
# `uv sync` installs dependencies into .venv and we run from ./src via PYTHONPATH.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

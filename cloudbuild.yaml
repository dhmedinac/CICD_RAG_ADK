# Cloud Build pipeline for the RAG agent.
#
# One config drives both environments. Each Cloud Build trigger lives in its own
# GCP project (dev -> rag-agent-dev on branch `dev`, prod -> rag-agent-prod on
# branch `prod`) and supplies the substitutions below. ${PROJECT_ID} is provided
# automatically by the trigger. The prod trigger additionally requires manual
# approval before the build runs (configured on the trigger, see docs/SETUP.md).
# 
# Steps: build image -> push to Artifact Registry -> sync the Vertex RAG corpus
# from GCS -> deploy to Cloud Run.

substitutions:
  _AR_REGION: us-central1                # Artifact Registry region (must match existing repo)
  _REGION: europe-west1                  # RAG Engine and Cloud Run region
  _AR_REPO: rag-agent
  _SERVICE: rag-agent
  _ENV: dev
  _CORPUS_DISPLAY_NAME: rag-agent-corpus
  _GCS_SOURCE: gs://rag-agent-dev-corpus/
  _RUNTIME_SA: ""                       # leave empty to use the default compute SA
  _API_KEY_SECRET: rag-agent-api-key
  _AGENT_MODEL: gemini-2.5-flash
  _MEMORY: 1Gi
  _CPU: "1"
  _MIN_INSTANCES: "0"
  _MAX_INSTANCES: "4"
  # PostgreSQL Database
  _DB_INSTANCE: rag-agent-postgres
  _DB_NAME: rag_agent_sessions
  _DB_USER: rag_agent
  _DB_PASSWORD_SECRET: postgres-password

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

images:
  - ${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}

timeout: 1800s

steps:
  # 1. Build the container image.
  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -t
      - ${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}
      - -t
      - ${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest
      - .

  # 2. Push all tags to Artifact Registry.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}

  # 3. Create the corpus if missing and import documents from GCS.
  #    Reuses the freshly built image so the SDK versions match runtime exactly.
  - id: corpus-sync
    name: ${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}
    entrypoint: sh
    env:
      - GOOGLE_CLOUD_PROJECT=${PROJECT_ID}
      - GOOGLE_CLOUD_LOCATION=${_REGION}
      - GOOGLE_GENAI_USE_VERTEXAI=TRUE
    args:
      - -c
      - |
        set -e
        python scripts/manage_corpus.py sync \
          --display-name "${_CORPUS_DISPLAY_NAME}" \
          --gcs-source "${_GCS_SOURCE}" | tee /workspace/corpus.out
        grep '^RAG_CORPUS=' /workspace/corpus.out | tail -n1 | cut -d= -f2 \
          > /workspace/rag_corpus.txt
        echo "Resolved corpus: $$(cat /workspace/rag_corpus.txt)"

  # 4. Deploy to Cloud Run with Cloud SQL Auth Proxy sidecar.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        RAG_CORPUS="$$(cat /workspace/rag_corpus.txt)"

        # Substitute placeholders in service.yaml with actual values
        sed -i "s|AGENT_IMAGE_PLACEHOLDER|${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${SHORT_SHA}|g" /workspace/service.yaml
        sed -i "s|PROJECT_ID_PLACEHOLDER|${PROJECT_ID}|g" /workspace/service.yaml
        sed -i "s|REGION_PLACEHOLDER|${_REGION}|g" /workspace/service.yaml
        sed -i "s|INSTANCE_NAME_PLACEHOLDER|${_DB_INSTANCE}|g" /workspace/service.yaml
        sed -i "s|RAG_CORPUS_PLACEHOLDER|$$RAG_CORPUS|g" /workspace/service.yaml

        # Deploy using the service YAML with sidecar
        gcloud run services replace /workspace/service.yaml \
          --region=${_REGION} \
          --project=${PROJECT_ID}
